name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Pint · Larastan · Pest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: promotion
          MYSQL_USER: promotion
          MYSQL_PASSWORD: promotion
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: promotion
      DB_USERNAME: promotion
      DB_PASSWORD: promotion

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none
          ini-values: memory_limit=-1

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Aguardar MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent && break
            sleep 2
          done

      - name: Migrations
        run: php artisan migrate --force

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Análise estática (Larastan)
        # Larastan carrega o container do Laravel inteiro; o default de 128M não basta.
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Testes (Pest)
        run: ./vendor/bin/pest

      - name: Build da imagem Docker
        run: docker build -t promotion .
