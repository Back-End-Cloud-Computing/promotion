apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: promotion-db-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-db
  labels:
    app: promotion-db
spec:
  replicas: 1
  strategy:
    # Uma réplica de MySQL não suporta rolling update sobre o mesmo PVC — dois
    # pods montando o mesmo ReadWriteOnce ao mesmo tempo corrompe o volume.
    type: Recreate
  selector:
    matchLabels:
      app: promotion-db
  template:
    metadata:
      labels:
        app: promotion-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: promotion-config
                  key: DB_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: promotion-config
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promotion-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promotion-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: promotion-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-db
spec:
  type: ClusterIP
  selector:
    app: promotion-db
  ports:
    - port: 3306
      targetPort: 3306
