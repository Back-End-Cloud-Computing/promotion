apiVersion: v1
kind: ConfigMap
metadata:
  name: promotion-config
data:
  APP_NAME: "Promotion"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://promotion:8000"
  APP_TIMEZONE: "UTC"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  DB_HOST: "promotion-db"
  DB_PORT: "3306"
  DB_DATABASE: "promotion"
  DB_USERNAME: "promotion"
  SESSION_DRIVER: "array"
  CACHE_STORE: "array"
  QUEUE_CONNECTION: "sync"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
