apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Nenhum manifest kind: Secret aqui, nem como template — "segredos fora do
# repositório" é literal. O Secret de verdade entra via `kubectl create secret`,
# comando e lista de chaves documentados em k8s/README.md.
resources:
  - configmap.yaml
  - mysql.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
