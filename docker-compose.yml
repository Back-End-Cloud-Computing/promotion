services:
  promotion-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: promotion
      MYSQL_USER: promotion
      MYSQL_PASSWORD: promotion
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - promotion-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  promotion-db-data:
