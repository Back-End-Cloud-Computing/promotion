services:
  promotion-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: promotion
      MYSQL_USER: promotion
      MYSQL_PASSWORD: promotion
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - promotion-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  promotion-app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: promotion-db
      DB_PORT: 3306
      DB_DATABASE: promotion
      DB_USERNAME: promotion
      DB_PASSWORD: promotion
      LOG_CHANNEL: stderr
    ports:
      - "8000:8000"
    depends_on:
      promotion-db:
        condition: service_healthy

volumes:
  promotion-db-data:
